function fin(){const r=S.sc/S.n,st=r>=.9?3:r>=.6?2:1,k=S.k,li=S.li;stars[k+li]=Math.max(stars[k+li]||0,st);
 app.innerHTML=`<div class="card res"><div class="em">${st==3?'🏆':'🎉'}</div><h2>${'⭐'.repeat(st)}</h2><p>Você acertou de primeira <b>${S.sc}</b> de <b>${S.n}</b>.<br>Pontos: ${pts}</p><button class="go" onclick="go('${k}',${li})">Jogar de novo 🔁</button><button class="go" style="background:#1fa968" onclick="unit('${k}')">Próxima missão ➜</button></div>`}
function cloze(k,w,li){w=w||'x';li=li==null?7:li;const x=U[k][w];let h=x.t.replace(/\{(\d)\}/g,(m,n)=>`<select id="g${n}"><option value="">...</option>`+sh(x.gaps[n][0]).map(o=>`<option>${o}</option>`).join('')+'</select>');
 app.innerHTML=`<div class="top"><button class="back" onclick="unit('${k}')">←</button><span>⭐ ${pts}</span></div><h2>📖 Complete o texto</h2><p>Escolha a opção certa em cada lacuna.</p><div class="card txt">${h}</div><div id="fb"></div><button class="go" onclick="chkC('${k}','${w}',${li})">Verificar ✔</button>`}
function chkC(k,w,li){const x=U[k][w];let sc=0;x.gaps.forEach((g,n)=>{const s=$('#g'+n),ok=s.value==g[0][g[1]];s.className=ok?'ok':'no';if(ok)sc++;else s.title=g[0][g[1]]});
 pts+=sc*10;S={sc:sc,n:x.gaps.length,k:k,li:li};
 const bad=x.gaps.map((g,n)=>$('#g'+n).className=='no'?`${n+1}: <b>${g[0][g[1]]}</b>`:'').filter(Boolean);
 $('#fb').innerHTML=`<div class="fb">Acertos: ${sc}/${x.gaps.length}${bad.length?'<br>Respostas certas das vermelhas → '+bad.join(' · ')+'<br>Corrija e verifique de novo!':''}</div>`+(sc==x.gaps.length?'<button class="go" onclick="fin()">Ver estrelas ➜</button>':'')}
function gomix(i){const m=U.mix,k='mix';
 if(i==0)return tip(k,0);
 if(i==1)return run(m.cl.map(c=>mk('Que gramática é esta?<div class="hint"><b>'+c[0]+'</b></div>',['Past Continuous (was/were + ING)','used to (hábito antigo)','had to (obrigação)'],c[1])),k,1);
 if(i==2)return run(m.g.map(g=>mk(g[0],g[1],g[2])),k,2);
 if(i==3)return run(m.o.map(s=>({t:'o',w:s.split(' '),j:' ',h:'Qual gramática combina? Monte a frase'})),k,3);
 if(i==4)return cloze(k,'x',4);
 if(i==5)return cloze(k,'x2',5);
 if(i==6)return run(m.x.r.concat(m.x2.r),k,6,[m.x,m.x2].map(x=>x.t.replace(/\{(\d)\}/g,(a,n)=>'<b>'+x.gaps[n][0][x.gaps[n][1]]+'</b>')).join('<hr>'));}
home();
</script></body></html>
